# This file is the vision switch. Edit it to point picture-labeling at a
# different login or API. Do not put a password or API key in this file.
#
# backend: codex-login
#   The ChatGPT/Codex sign-in already on this machine. Not a paid API key.
#   model: the model name that sign-in accepts. Selected for this run: gpt-6-sol.
#
# backend: openai-api
#   A normal API call. model is the model name. base_url is the service
#   address (OpenAI, or another service that accepts the same picture call).
#   api_key_env is the NAME of the environment variable that holds the key.
#   Example:
#     backend: openai-api
#     model: gpt-4.1
#     base_url: https://api.openai.com/v1
#     api_key_env: OPENAI_API_KEY
backend: codex-login
model: gpt-6-sol
