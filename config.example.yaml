# Copy to config.yaml for automatic project defaults, or pass explicitly:
#   .venv/bin/scenery-brief-clips <run|rank|jev-gate|analyze|export> ... --config config.example.yaml
# Explicit CLI flags override these values. Config cannot loosen
# resolution/aspect requirements compiled from the prompt. Downloads stay
# forbidden in the default pipeline; the Part 5 export path must be authorized
# explicitly (allow_export: true here, or the --allow-export flag) and only
# acquires shortlisted sections at the configured cap (default 720p; valid
# range 720..2160), without scaling or upscaling.
allow_download: false
allow_export: false
# final export cap in pixels; valid range 720..2160
export_max_height: 720
max_search_results: 20
max_metadata_fetches: 30
sleep_s: 2.0
min_height: 720
min_width: 1280
aspect_min: 1.70
aspect_max: 1.86
max_tiles: 12
max_rank_videos: 10
max_analysis_s: 120
max_analyze_videos: 1

# Part 3 continuity gate (soft dissolve / mid-excerpt cut detection on analysis copies).
# Samples ~continuity_sample_fps dHashes across each candidate excerpt; if adjacent or
# first↔last Hamming exceeds the thresholds, trim to the longest stable subspan that
# still meets duration_min_s, or reject the excerpt. Fail-closed and deterministic.
#
# Analyze concurrency and decode defaults are env vars (not YAML keys):
#   SCENERY_ANALYZE_WORKERS=2          # parallel spans (default 2; 4 swaps this 1.6 GB host); 1 = serial
#   SCENERY_DETECT_FRAME_SKIP=1        # PySceneDetect frame skip; set 0 for every frame
#   SCENERY_CONTINUITY_DECODE_WIDTH=160  # px width before dHash/mean-RGB; set 0 for full frame
#   SCENERY_ANALYZE_PROFILE=/path.json # optional phase timings dump
continuity_enabled: true
# Detector: "blend" (default since 2026-09-29): 6 fps motion-compensated cut
# test + cross-dissolve blend fit, tolerant of pans and marching crowds
# (src/scenery_brief_clips/continuity_blend.py; numbers in
# benchmark/continuity_eval/). "legacy" restores the dHash/mean-RGB threshold
# gate; the sample_fps/hamming/color keys below apply only to legacy.
continuity_detector: blend
continuity_sample_fps: 2.0
continuity_max_adjacent_hamming: 18
continuity_max_endpoint_hamming: 22
continuity_max_adjacent_color: 28.0
continuity_max_endpoint_color: 35.0

# Optional Jev decisions (off by default). See docs/JEV.md.
# typesafe/jev-1.13 via the OpenRouter decisions endpoint; text only, no pixels.
# The key is read ONLY from the OPENROUTER_API_KEY environment variable; never
# put a key in this file. No key, errors/timeouts, or reaching
# jev_max_usd_per_run fall back (search order kept, candidate kept, note entry
# unchanged). Cache: data/cache/jev/. Well under $0.01 per run.
# run-pipeline: order search hits before metadata fetch and reject candidates
# whose score (mean of P(usable), P(subject), P(conditions)) <= jev_reject_below
jev_rank: false
# run-pipeline: exclude vision keep moments whose own note reports a failure
jev_note_check: false
# note violation when P(violation) >= this (0..1)
jev_note_reject_at: 0.70
# manual `jev-gate` command (after run/run-brief, before rank); same questions
jev_gate: false
# reject when score <= this (0..1, must be below jev_keep_above)
jev_reject_below: 0.35
# manual gate only: informational keep_high label; never skips rank/tile review
jev_keep_above: 0.85
# per-request timeout, seconds
jev_timeout_s: 20
# per-run cost cap in USD; once reached, remaining candidates fall back to rules
jev_max_usd_per_run: 0.25
# manual gate only: order survivors by score so rank/analyze caps take the best first
jev_order_by_p: true

# NOT YET FUNCTIONAL: implemented and unit-tested only, never run against
# YouTube. Keep these commented out unless the owner asks for a live test.
# Opt-in YouTube fallback (owner decision; off by default). Used only after
# YouTube refuses this host ("Sign in to confirm you're not a bot"), then for
# the rest of that invocation. The cookies file is a Netscape cookies.txt that
# must live OUTSIDE this project (it is a credential; use a throwaway account).
# The proxy is an http(s):// or socks5(h):// URL. Never commit either value.
# youtube_cookies_file: ~/.config/scenery-brief-clips/youtube-cookies.txt
# youtube_proxy: socks5h://127.0.0.1:1080
